name: Validate listings
on:
  pull_request:
    paths: ["data/**", "scripts/validate.mjs"]
  push:
    branches: [main]
    paths: ["data/**", "scripts/validate.mjs"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
